<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Gallery fotografica">
  <meta name="theme-color" content="#faf6f2">
  <title>Gallery</title>
  <link rel="stylesheet" href="assets/css/style.css?v=20260902b">
</head>
<body>
  <section class="intro" id="intro" aria-label="Presentazione">
    <div class="intro-bg" id="intro-bg" aria-hidden="true">
      <div class="intro-strip-wrap" id="intro-strip-wrap" aria-hidden="true">
        <div class="intro-strip intro-strip--top" id="intro-strip-top"></div>
        <div class="intro-strip intro-strip--bottom" id="intro-strip-bottom"></div>
      </div>
      <div class="intro-photos" id="intro-photos"></div>
      <div class="intro-blob intro-blob--1"></div>
      <div class="intro-blob intro-blob--2"></div>
      <div class="intro-blob intro-blob--3"></div>
      <div class="intro-shimmer"></div>
      <div class="intro-veil"></div>
    </div>
    <div class="intro-overlay" id="intro-overlay" aria-hidden="true"></div>
    <div class="intro-content">
      <p class="intro-eyebrow" id="hero-eyebrow"></p>
      <h1 class="intro-title" id="hero-title"></h1>
      <p class="intro-subtitle" id="hero-subtitle"></p>
    </div>
    <button type="button" class="intro-scroll" id="intro-scroll" aria-label="Vai alla gallery">
      <span id="hero-scroll-label">Scorri</span>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path d="M12 5v14M5 12l7 7 7-7"/>
      </svg>
    </button>
  </section>

  <main class="gallery-wrap" id="gallery">
    <section class="gallery-section" aria-label="Gallery foto e video">
      <div class="gallery-grid" id="gallery-grid" role="list"></div>
    </section>
    <footer class="footer">
      <p class="footer-heart" id="footer-symbol" aria-hidden="true">♥</p>
      <p class="footer-text" id="footer-text"></p>
    </footer>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Anteprima media" hidden>
    <button class="lightbox-close" id="lightbox-close" aria-label="Chiudi">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Elemento precedente">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>
    <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Elemento successivo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </button>
    <figure class="lightbox-content">
      <div class="lightbox-media" id="lightbox-media">
        <img class="lightbox-img" id="lightbox-img" src="" alt="" hidden>
        <video class="lightbox-video" id="lightbox-video" controls playsinline preload="metadata" hidden></video>
      </div>
    </figure>
    <aside class="lightbox-dock" aria-label="Navigazione gallery">
      <p class="lightbox-counter" id="lightbox-counter" aria-live="polite"></p>
      <div class="lightbox-thumbs" id="lightbox-thumbs" aria-label="Anteprime gallery">
        <div class="lightbox-thumbs-track" id="lightbox-thumbs-track"></div>
      </div>
    </aside>
  </div>

  <script src="assets/js/event-loader.js?v=20260902b"></script>
  <script src="assets/js/intro.js?v=20260902b"></script>
  <script src="assets/js/gallery.js?v=20260902b"></script>
  <script src="assets/js/app.js?v=20260902b"></script>
</body>
</html>
